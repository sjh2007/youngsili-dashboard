# SPA 서빙 — 해시 라우팅이라 필수는 아니지만 딥링크 대비 index.html 폴백 유지
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 정적 자산 캐시 (파일명 해시 포함이라 장기 캐시 안전)
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
